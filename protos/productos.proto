syntax = "proto3";

package productos;

service ProductoServicio {
  rpc Crear(CrearRequest) returns (Producto);
  rpc Actualizar(ActualizarRequest) returns (Producto);
  rpc Obtener(IdRequest) returns (Producto);
  rpc Eliminar(IdRequest) returns (EliminarResponse);
  rpc Listar(ListarRequest) returns (ListarResponse);
  rpc DescontarStock(DescontarRequest) returns (Producto);
  rpc ReponerStock(ReponerRequest) returns (Producto);
}

enum Categoria {
  CATEGORIA_DESCONOCIDO = 0;
  CATEGORIA_1 = 1;
  CATEGORIA_2 = 2;
  CATEGORIA_3 = 3;
}

message Producto {
  int32 id = 1;
  string nombre = 2;
  double precio = 3;
  int32 stock = 4;
  Categoria categoria = 5;
  repeated string etiquetas = 6;
}

message CrearRequest {
  string nombre = 1;
  double precio = 2;
  int32 stock = 3;
  Categoria categoria = 4;
  repeated string etiquetas = 5;
}

message ActualizarRequest {
  int32 id = 1;
  optional string nombre = 2;
  optional double precio = 3;
  optional Categoria categoria = 4;
  ListaEtiquetas etiquetas = 5;
}

message ListaEtiquetas {
  repeated string valores = 1;
}

message IdRequest {
  int32 id = 1;
}

message ListarRequest {}

message ListarResponse {
  repeated Producto productos = 1;
}

message EliminarResponse {
  bool eliminado = 1;
}

message DescontarRequest {
  int32 producto_id = 1;
  int32 cantidad = 2;
}

message ReponerRequest {
  int32 producto_id = 1;
  int32 cantidad = 2;
}
