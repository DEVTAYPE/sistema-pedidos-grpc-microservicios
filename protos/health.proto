syntax = "proto3";

package grpc.health.v1;

service Health {
  rpc Check (HealthRequest) returns (HealthResponse);
}

message HealthRequest {
  string service = 1;
}

message HealthResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }

  ServingStatus status = 1;
}